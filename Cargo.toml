[workspace]
resolver = "2"
members = [
    "crates/agent-shared",
    "crates/agentd",
    "crates/capture-helper",
    # `tray` is a Tauri 2 app with its own toolchain (needs npm + tauri CLI); it lives at
    # `tray/src-tauri` and depends on `agent-shared` by path. It is intentionally NOT a
    # workspace member so `cargo check` on the core stays fast and toolchain-free.
]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting"] }
thiserror = "1"

agent-shared = { path = "crates/agent-shared" }

# The shared agent↔backend contract is OWNED BY THE BACKEND REPO (the API authority):
# `backend/crates/wp-agent-contract`. The backend `ingest` binary depends on it by path (workspace
# member); the desktop agent compiles the *same* crate, so the wire envelope can't drift.
#
# NOW (local dev): a path dep to the sibling backend checkout — clone the repos side by side
# (`.../backend`, `.../desktop`). CI checks out the backend repo alongside.
wp-agent-contract = { path = "../backend/crates/wp-agent-contract" }
#
# CROSS-REPO (CI / release): the backend repo is the source; git-dep into it and pin a tag. Cargo
# picks the `wp-agent-contract` package out of the backend workspace. Keep a local [patch] for dev:
#   wp-agent-contract = { git = "https://github.com/<org>/backend.git", tag = "agent-contract-v0.1.0" }
#   [patch."https://github.com/<org>/backend.git"]
#   wp-agent-contract = { path = "../backend/crates/wp-agent-contract" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
