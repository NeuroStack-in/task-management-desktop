[workspace]
resolver = "2"
members = ["src-tauri"]

# ONE Tauri process (BUILD-PLAN §0/§1 — amends LLD Appendix A's 3-process split). The former
# `crates/agentd` + `crates/capture-helper` + `crates/agent-shared` + `tray/` are gone; their four
# real slices moved into `src-tauri/src/`. `monitor/` stays free of Tauri types so a daemon can be
# split back out later without a rewrite (§0).

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"
local-ip-address = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"

# The agent↔backend wire contract is OWNED BY THE BACKEND REPO (the API authority):
# `backend/crates/wp-agent-contract`. The backend `ingest` binary depends on it too, so the wire
# envelope can't drift — the whole point of a shared crate. The single process depends on it
# DIRECTLY now (no more `agent-shared` re-export).
#
# NOW (local dev): a path dep to the sibling backend checkout — clone the repos side by side
# (`.../backend`, `.../desktop`).
wp-agent-contract = { path = "../backend/crates/wp-agent-contract" }
#
# PIN IT (CI / release) — BUILD-PLAN §1, non-negotiable (this exact drift already bit us once):
# git-dep into the backend repo at a tag, with a local [patch] for dev:
#   wp-agent-contract = { git = "https://github.com/<org>/backend.git", tag = "agent-contract-v0.1.0" }
#   [patch."https://github.com/<org>/backend.git"]
#   wp-agent-contract = { path = "../backend/crates/wp-agent-contract" }
# CI must also run a job that fails on contract drift (compile the agent against the pinned rev).

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
