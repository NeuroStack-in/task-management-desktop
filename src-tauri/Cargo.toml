[package]
name = "workpulse-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WorkPulse desktop agent — one Tauri process: Rust core (capture, timer, outbox, sole egress) + Preact webview."

# Lib split (the sample is a plain bin) so integration tests can link the core (BUILD-PLAN §1).
[lib]
name = "workpulse_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workpulse-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
sysinfo = { workspace = true }
local-ip-address = { workspace = true }
reqwest = { workspace = true }
rumqttc = { workspace = true }
keyring = { workspace = true }
base64 = { workspace = true }
device_query = { workspace = true }
user-idle = { workspace = true }
x-win = { workspace = true }
xcap = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
image_hasher = { workspace = true }
# Cryptographic content hash for screenshot tamper-evidence (verify bytes at upload == bytes at
# capture). Already in the tree; pinned to 0.10.
sha2 = "0.10"
wp-agent-contract = { workspace = true }

# Native device geolocation (precise GPS / OS positioning) for the heartbeat — one platform-standard
# backend per OS, each behind the same `location::capture()` seam (see `src/location/`).
#
# Every crate below was **already resolved in Cargo.lock** as a transitive Tauri dependency, so these
# entries pin what the tree already carries rather than pulling new stacks. That matters: it keeps the
# version choice consistent with Tauri's own, and adds no download.

# Windows — WinRT `Windows.Devices.Geolocation`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Devices_Geolocation",
    "Foundation",
    # Power/session notifications for `monitor::power` — Windows announces a suspend, a closed lid,
    # a display turning off and a session lock, and tao surfaces none of them.
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS — CoreLocation, the only sanctioned positioning API on the platform. `objc2-core-foundation`
# is for the run loop: CLLocationManager delivers fixes through a run loop, so a worker thread that
# never turns one is handed nothing, forever.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLLocation", "CLLocationManager"] }
objc2-foundation = { version = "0.3", features = ["NSDate"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }

# Linux — GeoClue2 over D-Bus (`org.freedesktop.GeoClue2`), the freedesktop standard every desktop
# location consumer uses. `blocking-api` because `capture()` is called from `spawn_blocking`, so the
# synchronous proxy is the honest fit — no nested runtime.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

# Real OS/IO backends are added with their milestones (kept out of M0 so the tree builds without
# system libs): M1 reqwest + keyring · M4 device_query + user-idle + x-win + sysinfo ·
# M5 xcap + image + webp + image_hasher · M7 the updater.

[features]
# Release builds serve the bundled webview over the custom protocol (no devUrl).
custom-protocol = ["tauri/custom-protocol"]
