[package]
name = "workpulse-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WorkPulse desktop agent — one Tauri process: Rust core (capture, timer, outbox, sole egress) + Preact webview."

# Lib split (the sample is a plain bin) so integration tests can link the core (BUILD-PLAN §1).
[lib]
name = "workpulse_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workpulse-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
local-ip-address = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
base64 = { workspace = true }
device_query = { workspace = true }
user-idle = { workspace = true }
x-win = { workspace = true }
xcap = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
image_hasher = { workspace = true }
wp-agent-contract = { workspace = true }

# Real OS/IO backends are added with their milestones (kept out of M0 so the tree builds without
# system libs): M1 reqwest + keyring · M4 device_query + user-idle + x-win + sysinfo ·
# M5 xcap + image + webp + image_hasher · M7 the updater.

[features]
# Release builds serve the bundled webview over the custom protocol (no devUrl).
custom-protocol = ["tauri/custom-protocol"]
