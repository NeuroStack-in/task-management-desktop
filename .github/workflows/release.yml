name: Release

# Tag-driven cross-platform release of the WorkPulse desktop agent. Produces the same installer set
# as the TaskFlow reference (docs/REFERENCE-TASKFLOW.md):
#   Windows  WorkPulse_<v>_x64-setup.exe   (NSIS)
#   Linux    WorkPulse_<v>_amd64.AppImage + WorkPulse_<v>_amd64.deb
#   macOS    WorkPulse_<v>_universal.dmg   (Intel + Apple Silicon, one dmg)
#   + SHA256SUMS and SHA256SUMS.sig (Ed25519 — see SHA256SUMS.pub)
#
# UNLIKE TaskFlow, WorkPulse's in-app updater is the Tauri plugin, so this release ALSO carries the
# updater's `latest.json` + per-artifact minisign `.sig` (tauri.conf.json pubkey verifies them). The
# SHA256SUMS trust root is SEPARATE and only for manual/OS verification of a downloaded installer.
#
# Everything lands in a DRAFT release — a human publishes it (UPDATES-SECURITY.md §4.5). Keep the tag,
# src-tauri/Cargo.toml `version`, and tauri.conf.json `version` in lockstep (e.g. v0.1.0 -> "0.1.0").
#
# Required secrets:
#   BACKEND_REPO_TOKEN                  read access to the backend repo (wp-agent-contract path-dep).
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD   minisign key for the Tauri updater artifacts.
#   RELEASE_SIGNING_KEY_B64             Ed25519 private key (base64) that signs SHA256SUMS.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/attach (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `.sig` files are collected alongside the installers: they are what the updater verifies,
          # and `latest.json` embeds their contents (see the `updater-manifest` job).
          - os: windows-latest
            label: windows
            bundles: nsis
            targetArg: ""
            rust_targets: ""
            artifacts: |
              desktop/target/release/bundle/nsis/*-setup.exe
              desktop/target/release/bundle/nsis/*-setup.exe.sig
          - os: ubuntu-22.04
            label: linux
            bundles: deb,appimage
            targetArg: ""
            rust_targets: ""
            artifacts: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/appimage/*.AppImage.sig
              desktop/target/release/bundle/deb/*.deb
          # One macOS job → a UNIVERSAL dmg (Intel + Apple Silicon lipo'd together) on the arm64
          # runner. Don't split off a macos-13 Intel job: GitHub retired the Intel runners.
          #
          # `app` is bundled as well as `dmg` because **Tauri's macOS updater ships the `.app.tar.gz`,
          # not the dmg** — a dmg-only build produces no updater artifact for macOS at all, so Macs
          # would silently never receive an update while Windows and Linux did.
          - os: macos-latest
            label: macos
            bundles: app,dmg
            targetArg: "--target universal-apple-darwin"
            # Space-separated — `rustup target add` takes multiple targets as separate args, not a
            # comma list (a comma makes it one bogus target name and the step fails).
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            artifacts: |
              desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: desktop

      # The agent wire-contract (`wp-agent-contract`) is owned by the backend repo and consumed as a
      # sibling path-dep — clone it beside desktop/, same as ci.yml. Current contract lives on
      # kishore/new (feat/giri is stale).
      - name: Checkout backend (sibling — provides wp-agent-contract)
        uses: actions/checkout@v4
        with:
          repository: NeuroStack-in/task-management-backend
          # The branch that actually owns the wire contract. This said `kishore/new`, a branch the
          # backend stopped moving long ago (99ec2e6), so every build compiled the agent against a
          # STALE `wp-agent-contract` while appearing to pass. That is the anti-drift check pointed
          # at the wrong target: it only looked healthy because the contract had not changed since.
          # The first real contract change broke all three OS jobs at once.
          #
          # Still a moving branch, not the tag `Cargo.toml` asks for - but a branch that is actually
          # maintained beats a pinned-looking one that is not. Pinning a tag remains the open task.
          ref: main
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets (macOS universal)
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.label }}-release

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libgtk-3-dev libxdo-dev libssl-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev \
            libxss-dev libxtst-dev libxi-dev libxext-dev libdbus-1-dev

      - name: Install webview deps
        working-directory: desktop/ui
        run: npm ci

      # tauri-action builds the constrained bundle set + the updater artifacts (latest.json + minisign
      # .sig), and uploads them to the DRAFT release for this tag.
      # PINNED to a SHA, not the floating `@v0`. That tag moved between the v0.1.0 release and the
      # v0.1.1 attempt, bringing a Tauri CLI that runs `beforeBuildCommand` from the **frontend**
      # directory instead of the project root — which broke all three platforms at once on a commit
      # that touched nothing but a version string. A release workflow that can break without anyone
      # changing the repo is not a release workflow. Bump this deliberately, and read the changelog.
      - name: Build bundles + updater artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Which backend the published agent talks to, baked in at build time (auth/config.rs reads
          # these via `option_env!`). Without them a downloaded installer had no app-client id at all
          # and every employee hit "This agent isn't configured for your organization yet" — the
          # bundle ships no `.env`, so runtime env was the only source and a clean machine has none.
          # These are public identifiers, not secrets, hence repo **variables**: set them under
          # Settings → Secrets and variables → Actions → Variables. Left unset, the build falls back
          # to the shared dev stack (auth/config.rs::DEV_CLIENT_ID) — fine for dev, wrong for prod, so
          # set them before cutting a customer-facing tag.
          WP_COGNITO_CLIENT_ID: ${{ vars.WP_COGNITO_CLIENT_ID }}
          WP_COGNITO_REGION: ${{ vars.WP_COGNITO_REGION }}
          WP_INGEST_URL: ${{ vars.WP_INGEST_URL }}
          # macOS **ad-hoc** code signing ("-" is codesign's ad-hoc identity). Empty on Windows and
          # Linux, where it is ignored.
          #
          # This is not a substitute for a Developer ID and does not fix the TCC problem (§7): an
          # ad-hoc signature carries no stable identity, so Screen Recording and Accessibility grants
          # still reset when the app updates. It is here for a harder reason — **Apple Silicon refuses
          # to execute unsigned arm64 code at all.** A universal binary shipped with no signature
          # whatsoever is killed on launch on every M-series Mac, which presents as "the app is
          # damaged and can't be opened", not as a signing warning. Ad-hoc signing is the minimum that
          # makes the build *run* on half the Macs in the field.
          #
          # Set APPLE_SIGNING_IDENTITY (plus APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID,
          # APPLE_PASSWORD, APPLE_TEAM_ID) as secrets to upgrade this to a real Developer ID and
          # notarisation — tauri-action picks them up and the value below stops applying.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # The certificate itself — without it tauri-action can only ad-hoc sign. Set these three
          # secrets to sign every release with a STABLE identity, which is what makes the macOS
          # Keychain "Always Allow" grant AND the Screen-Recording/Accessibility grants PERSIST across
          # auto-updates (an ad-hoc signature changes every build and resets them):
          #   APPLE_CERTIFICATE           base64 of a .p12 export of a Code Signing cert (self-signed
          #                               is enough for persistence; a Developer ID also adds Gatekeeper
          #                               trust + notarisation).
          #   APPLE_CERTIFICATE_PASSWORD  the password chosen when exporting the .p12.
          #   APPLE_SIGNING_IDENTITY      the cert's exact name (e.g. "WorkPulse Self-Signed").
          #   KEYCHAIN_PASSWORD           any string — for the throwaway keychain tauri-action creates.
          # All unset ⇒ empty ⇒ tauri-action keeps the ad-hoc '-' above (still runs on Apple Silicon,
          # just no persistence), so this is safe to leave unconfigured.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "WorkPulse Agent ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Automated cross-platform build. Draft — verify SHA256SUMS, then publish to roll out via the updater."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} ${{ matrix.targetArg }}

      # Hand the raw installers to the checksums job (which needs all three OSes' output at once).
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  checksums:
    name: SHA256SUMS + sign
    needs: build
    runs-on: ubuntu-latest
    env:
      SIGN_KEY: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Flatten installers into release-files/
        run: |
          mkdir -p release-files
          find staged -type f \
            \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} release-files/ \;
          echo "=== installers ===" && ls -la release-files

      - name: Generate SHA256SUMS
        working-directory: release-files
        run: |
          sha256sum * > SHA256SUMS
          echo "=== SHA256SUMS ===" && cat SHA256SUMS

      - name: Sign SHA256SUMS (Ed25519)
        if: env.SIGN_KEY != ''
        run: |
          python3 -m pip install --quiet pynacl
          python3 - <<'PY'
          import base64, os
          from nacl.signing import SigningKey
          key = SigningKey(base64.b64decode(os.environ["SIGN_KEY"]))
          body = open("release-files/SHA256SUMS", "rb").read()
          sig = key.sign(body).signature
          open("release-files/SHA256SUMS.sig", "wb").write(base64.b64encode(sig))
          print("SHA256SUMS -> SHA256SUMS.sig")
          PY

      - name: Warn if unsigned
        if: env.SIGN_KEY == ''
        run: echo "::warning::RELEASE_SIGNING_KEY_B64 not set — SHA256SUMS shipped UNSIGNED."

      - name: Verify SHA256SUMS covers every installer
        working-directory: release-files
        run: |
          fail=0
          for f in *; do
            case "$f" in SHA256SUMS|SHA256SUMS.sig) continue;; esac
            grep -qi " [*]\?${f}\$" SHA256SUMS || { echo "MISSING: $f"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK: all installers covered" || exit 1

      - name: Attach SHA256SUMS to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            release-files/SHA256SUMS
            release-files/SHA256SUMS.sig

  # The desktop repo is PRIVATE, so its release assets can't be fetched anonymously. Mirror the
  # installers to the public S3 downloads bucket the web app's Download page links to. Runs even on a
  # partial build (`!cancelled()`), so a working platform still ships if another's build breaks.
  s3-mirror:
    name: mirror installers to S3
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload to the public downloads bucket
        env:
          BUCKET: wp-downloads-dev
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          shopt -s nullglob
          found=0
          # Each installer goes to an immutable `agent/v<version>/<original-name>` AND the stable
          # `agent/latest/<version-less-name>` the site links to (overwritten every release).
          while IFS= read -r f; do
            found=1
            base="$(basename "$f")"
            case "$base" in
              *-setup.exe)  stable="WorkPulse-x64-setup.exe";  ct="application/octet-stream" ;;
              *.dmg)        stable="WorkPulse-universal.dmg";   ct="application/octet-stream" ;;
              *.deb)        stable="WorkPulse-amd64.deb";       ct="application/vnd.debian.binary-package" ;;
              *.AppImage)   stable="WorkPulse-amd64.AppImage";  ct="application/octet-stream" ;;
              *) continue ;;
            esac
            echo "→ $base  ⇒  agent/v$VERSION/$base  +  agent/latest/$stable"
            aws s3 cp "$f" "s3://$BUCKET/agent/v$VERSION/$base" --content-type "$ct"
            aws s3 cp "$f" "s3://$BUCKET/agent/latest/$stable"  --content-type "$ct"
          done < <(find staged -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          [ "$found" = 1 ] && echo "mirrored to s3://$BUCKET/agent/" || echo "::warning::no installers found to mirror"

      # ── The updater manifest ────────────────────────────────────────────────────────────────────
      #
      # Written here rather than reused from the GitHub release, because tauri-action's `latest.json`
      # points at **github.com release assets** — and this repo is private, so an installed agent
      # (which has no GitHub credentials) gets 404 on every check. Self-update was configured,
      # signed, and entirely non-functional; every upgrade meant asking each employee to download
      # the installer by hand.
      #
      # So the same manifest is rebuilt with **S3 URLs**, pointing at the immutable `agent/v<version>/`
      # copies — never `agent/latest/`, whose contents are replaced by the next release and would
      # then no longer match the signature recorded here.
      #
      # The `.sig` files are minisign signatures produced by TAURI_SIGNING_PRIVATE_KEY; the agent
      # verifies them against the public key baked into the binary. Serving the manifest from a
      # public bucket changes only *where the manifest is read*, never *whether an artifact is
      # trusted* — an attacker who replaced a file in the bucket still could not forge its signature.
      - name: Build and upload latest.json
        env:
          BUCKET: wp-downloads-dev
          BASE: https://wp-downloads-dev.s3.ap-south-1.amazonaws.com
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Pair each updater artifact with its signature. Keys are Tauri's platform identifiers;
          # `darwin-universal` covers both Intel and Apple Silicon from the one lipo'd bundle.
          entries=""
          add() {  # $1 = platform key, $2 = artifact path
            [ -f "$2" ] || return 0
            [ -f "$2.sig" ] || { echo "::warning::no signature for $(basename "$2") — $1 omitted"; return 0; }
            sig="$(cat "$2.sig")"
            url="$BASE/agent/v$VERSION/$(basename "$2")"
            [ -n "$entries" ] && entries="$entries,"
            entries="$entries\"$1\":{\"signature\":\"$sig\",\"url\":\"$url\"}"
            echo "  $1 -> $(basename "$2")"
          }

          add "windows-x86_64" "$(find staged -name '*-setup.exe' | head -1)"
          add "linux-x86_64"   "$(find staged -name '*.AppImage'  | head -1)"
          add "darwin-universal" "$(find staged -name '*.app.tar.gz' | head -1)"

          if [ -z "$entries" ]; then
            echo "::warning::no signed updater artifacts — latest.json NOT written, existing manifest left alone"
            exit 0
          fi

          printf '{"version":"%s","notes":"WorkPulse agent %s","pub_date":"%s","platforms":{%s}}\n' \
            "$VERSION" "$VERSION" "$PUB_DATE" "$entries" > latest.json
          cat latest.json

          # `--cache-control no-cache`: agents poll this file, and a cached manifest means an update
          # that has shipped stays invisible for as long as the CDN/browser cache holds it.
          aws s3 cp latest.json "s3://$BUCKET/agent/latest/latest.json" \
            --content-type application/json --cache-control no-cache
          aws s3 cp latest.json "s3://$BUCKET/agent/v$VERSION/latest.json" \
            --content-type application/json

          # The updater downloads the artifact named in the manifest, so those must be in S3 too —
          # the installer loop above only mirrors the four user-facing installer formats.
          for f in $(find staged -name '*.app.tar.gz' -o -name '*.sig'); do
            aws s3 cp "$f" "s3://$BUCKET/agent/v$VERSION/$(basename "$f")" --content-type application/octet-stream
          done
