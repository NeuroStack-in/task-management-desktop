name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The agent's wire contract is a path-dep to the sibling backend checkout
# (`../backend/crates/wp-agent-contract`), so CI checks out BOTH repos side by side.
# Cross-repo checkout of the (private) backend needs a token — set repo secret
# BACKEND_REPO_TOKEN (a PAT / deploy key with read access to the backend repo).

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: desktop

      - name: Checkout backend (sibling — provides wp-agent-contract)
        uses: actions/checkout@v4
        with:
          repository: NeuroStack-in/task-management-backend
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Linux system deps: Tauri (webkit2gtk), X11 (device_query / x-win / xcap), C compiler (libwebp).
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libgtk-3-dev libxdo-dev libssl-dev \
            libx11-dev libxcb1-dev libxrandr-dev libdbus-1-dev

      - name: Format
        working-directory: desktop
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace

  ui:
    name: ui (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Typecheck + build
        working-directory: ui
        run: npm run build
